<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | David Izooba</title>
<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 155 }}">
<meta name="author" content="David Izooba">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:image" content="{{ site.url }}/{% if page.image %}{{ page.image }}{% else %}david-izooba-portrait.jpg{% endif %}">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"BlogPosting","headline":{{ page.title | jsonify }},"datePublished":"{{ page.date | date_to_xmlschema }}","author":{"@type":"Person","@id":"https://davidizooba.github.io/#david-izooba","name":"David Izooba","url":"https://davidizooba.github.io/"},"image":"{{ site.url }}/{% if page.image %}{{ page.image }}{% else %}david-izooba-portrait.jpg{% endif %}","mainEntityOfPage":"{{ site.url }}{{ page.url }}"}
</script>
<style>
:root{--bg:#0b0a0c;--card:#17141a;--ink:#f3ede4;--muted:#a69d92;--line:rgba(243,237,228,.1);--amber:#e6a25a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.8 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--amber)}img{max-width:100%;border-radius:6px}
nav{border-bottom:1px solid var(--line)}nav div{max-width:760px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;font-size:14px}
nav a{color:var(--ink);text-decoration:none}.logo{font-family:Fraunces,serif;font-size:20px}.logo i{color:var(--amber)}
article{max-width:760px;margin:0 auto;padding:80px 24px 120px}
.meta{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
h1{font-family:Fraunces,serif;font-weight:300;font-size:clamp(40px,7vw,68px);line-height:1.02;letter-spacing:-.03em;margin:14px 0 40px}
h2,h3{font-family:Fraunces,serif;font-weight:400;line-height:1.2;margin-top:2em}
blockquote{margin:2em 0;padding-left:22px;border-left:2px solid var(--amber);font-family:Fraunces,serif;font-style:italic;font-size:1.3em;color:#e9e2d8}
p{color:#d6cec3}.end{margin-top:70px;padding-top:30px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<nav><div><a class="logo" href="/">David <i>Izooba</i></a><a href="/journal/">← All posts</a></div></nav>
<article>
<div class="meta">{{ page.date | date: "%d %B %Y" }}{% if page.category %} · {{ page.category }}{% endif %}</div>
<h1>{{ page.title }}</h1>
{{ content }}
<div class="end">Written by <a href="/">David Izooba</a>: guitarist, worship leader and leadership practitioner, Kampala.</div>
</article>
</body>
</html>
